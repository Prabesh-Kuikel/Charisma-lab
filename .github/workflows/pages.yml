name: Deploy UI to GitHub Pages

# Publishes the PRE-BUILT site in docs/ — no npm build runs here, so this
# workflow cannot fail on dependencies or missing packages.
# Refresh docs/ locally with:  npm run build:pages
#
# Zero-Actions fallback (works even if this workflow fails):
#   Settings → Pages → Source: Deploy from a branch → main → /docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Enables Pages on first run and sets the site URL automatically.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
