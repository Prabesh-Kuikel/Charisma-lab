name: Deploy UI to GitHub Pages

# Publishes the PRE-BUILT site in docs/ — no npm build runs here, so this
# workflow cannot fail on dependencies or missing packages.
# Refresh docs/ locally with:  npm run build:pages
#
# Version note (2026-11): the Pages actions must be a current pair. The old
# combination (upload-pages-artifact v3 + deploy-pages v4) is the one that
# produces "No artifacts named 'github-pages' were found for this workflow run",
# because v3 uploads an artifact the current API no longer exposes the same way.
# Verified current majors: checkout v7, configure-pages v6, upload-pages-artifact
# v5, deploy-pages v5.
#
# Upload and deploy are also split into two jobs. deploy-pages listing a
# just-uploaded artifact in the same job has an intermittent race
# (actions/deploy-pages#451); from a downstream job it reads them reliably.
#
# Zero-Actions fallback (works even if this workflow fails):
#   Settings → Pages → Source: Deploy from a branch → main → /docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Enables Pages on first run and sets the site URL automatically.
      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      # docs/ is committed and already built. Nothing is compiled here.
      - name: Upload built site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
